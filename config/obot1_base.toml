# obot v1 with only its base connected: the two wheel boards on USB (`wl` with an iC-MU,
# `wr` with an iC-PZ as motor encoder). The arm's joints are left out, so the daemon runs
# with just these two boards plugged in. See obot1.toml for the whole robot.
#
# Everything marked VERIFY is a placeholder.

[robot]
name = "obot1_base"
period_us = 1000
command_timeout_ms = 150
comm_timeout_cycles = 10

[rt]
cpu = 3
priority = 80
lock_memory = true

[[bus]]
name = "usb"
interface = "usbrt"

# --- Base ------------------------------------------------------------------------------

[[joint]]
name = "left_wheel_joint"
bus = "usb"
usb_name = "wl"
id = 1
gear_ratio = 1.0
torque_constant = 0.5         # N m / A, VERIFY
direction = 1                 # VERIFY
continuous = true
qd_max = 8.0
qdd_max = 15.0
tau_max = 8.0
kd = 2.0
sim = { inertia = 0.3, damping = 0.05, current_limit = 20.0 }

[[joint]]
name = "right_wheel_joint"
bus = "usb"
usb_name = "wr"
id = 2
gear_ratio = 1.0
torque_constant = 0.5         # N m / A, VERIFY
direction = -1                # VERIFY
continuous = true
qd_max = 8.0
qdd_max = 15.0
tau_max = 8.0
kd = 2.0
sim = { inertia = 0.3, damping = 0.05, current_limit = 20.0 }

[base]
left = "left_wheel_joint"
right = "right_wheel_joint"
wheel_radius = 0.125          # m, VERIFY
track_width = 0.32            # m, VERIFY
v_max = 0.5
omega_max = 1.5

# --- Operator tools (read by the Python side, ignored by obot-rtd) ----------------------

[[camera]]
name = "front"
# The CSI camera on the Jetson Nano, through NVIDIA's camera source and JPEG encoder.
source = "gst:nvarguscamerasrc ! video/x-raw(memory:NVMM),width=1280,height=720,framerate=15/1 ! nvjpegenc"
fps = 15

# An Intel RealSense D435. On the Jetson Nano there is no librealsense; the kernel presents
# the camera as video devices, and realsense: finds the right ones whatever their numbers.
#
# xyz and rpy say where the camera is on the base (x forward, y left, z up from the floor;
# rpy[1] > 0 looks down). The 3D view on the operator page places what the depth camera
# sees with them. VERIFY: these are a guess. "Level to floor" on the page works out height
# and tilt from the floor in view and prints the values to put here.

[[camera]]
name = "d435"
source = "realsense:color"
width = 640
height = 480
fps = 15
xyz = [0.10, 0.015, 0.40]     # the colour sensor is 15 mm to the left of the depth origin
rpy = [0.0, 0.6, 0.0]

[[camera]]
name = "d435_depth"
source = "realsense:depth"
width = 640
height = 480
fps = 15
xyz = [0.10, 0.0, 0.40]
rpy = [0.0, 0.6, 0.0]
color = "d435"                # colours the 3D points

# The map of what the depth cameras have seen. These are the defaults.
[world]
voxel = 0.03                  # m: size of a map cell
range = 3.5                   # m: farther readings are not used
max_voxels = 250000
