[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "obot"
version = "0.1.0"
description = "Operator tools for obot robots: shared memory client, teleoperation, web UI, logging"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Unlicense" }
dependencies = ["numpy>=1.22", "tomli>=2; python_version < '3.11'"]

[project.optional-dependencies]
ui = ["aiohttp>=3.9", "opencv-python-headless>=4.8"]
log = ["mcap>=1.1", "protobuf>=4.25"]
viz = ["rerun-sdk>=0.20"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]
all = ["obot[ui,log,viz]"]

[project.scripts]
obot = "obot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
obot = ["ui/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["vcan: needs virtual CAN interfaces vcan0..vcan2"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
