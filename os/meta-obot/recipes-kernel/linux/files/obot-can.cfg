CONFIG_CAN=m
CONFIG_CAN_RAW=m
CONFIG_CAN_DEV=m
CONFIG_CAN_NETLINK=y
CONFIG_CAN_CALC_BITTIMING=y
# Virtual CAN: runs obot-rtd against obot-sim-node on the target without hardware.
CONFIG_CAN_VCAN=m
# USB CAN FD adapters (candleLight / CANable 2 with gs_usb firmware, PEAK).
CONFIG_CAN_GS_USB=m
CONFIG_CAN_PEAK_USB=m
# SPI CAN FD controllers (MCP2517FD / MCP2518FD).
CONFIG_CAN_MCP251XFD=m
