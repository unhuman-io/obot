BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "obot"
BBFILE_PATTERN_obot = "^${LAYERDIR}/"
BBFILE_PRIORITY_obot = "60"
LAYERVERSION_obot = "1"
LAYERSERIES_COMPAT_obot = "wrynose"
LAYERDEPENDS_obot = "core tegra openembedded-layer meta-python networking-layer virtualization-layer"

# The repository this layer lives in. obot-rt is built from that checkout, so an image
# always contains the daemon from the same commit as its recipes.
OBOT_SRC_DIR = "${@os.path.abspath(os.path.join('${LAYERDIR}', '..', '..'))}"
