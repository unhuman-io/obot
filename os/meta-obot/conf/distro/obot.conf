DISTRO = "obot"
DISTRO_NAME = "obot robot OS"
DISTRO_VERSION = "0.1.0"
DISTRO_CODENAME = "wrynose"
MAINTAINER = "obot <https://github.com/unhuman-io/obot>"
TARGET_VENDOR = "-obot"

INIT_MANAGER = "systemd"
DISTRO_FEATURES:append = " pam virtualization"
PACKAGE_CLASSES ?= "package_rpm"

SANITY_TESTED_DISTROS ?= " \
    ubuntu-24.04 \n \
    ubuntu-26.04 \n \
    "

# --- Realtime ---------------------------------------------------------------------------
# NVIDIA's 6.8 kernel with PREEMPT_RT (meta-tegra's -rt recipe) plus our fragment.
PREFERRED_PROVIDER_virtual/kernel:tegra = "linux-noble-nvidia-tegra-rt"

# The CPU reserved for the control thread: isolated from the scheduler, the tick and RCU
# callbacks by the kernel command line below, and used by obot-rtd.service. The last core
# of the module; the Orin Nano and Orin NX 8GB have six, the AGX Orin 64GB has twelve.
OBOT_RT_CPU ?= "5"
OBOT_RT_CPU:jetson-agx-orin-devkit ?= "11"
OBOT_HOUSEKEEPING_CPUS ?= "0-4"
OBOT_HOUSEKEEPING_CPUS:jetson-agx-orin-devkit ?= "0-10"

# efi=runtime (from meta-tegra's defaults) is kept on purpose: the A/B boot slot handling
# marks a boot successful through EFI variables, and without it the bootloader eventually
# falls back to the other slot. NVIDIA's realtime guide removes it for latency; measure
# with obot-rt-latency before trading that away.
KERNEL_ARGS:append:tegra = " isolcpus=managed_irq,domain,${OBOT_RT_CPU} nohz=on nohz_full=${OBOT_RT_CPU} rcu_nocbs=${OBOT_RT_CPU} rcu_nocb_poll irqaffinity=${OBOT_HOUSEKEEPING_CPUS} kthread_cpus=${OBOT_HOUSEKEEPING_CPUS}"

# CAN: the SoC's own controller (mttcan, out of tree) and the usual add-on adapters.
KERNEL_MODULE_AUTOLOAD:append:tegra = " mttcan can-raw"

# --- Containers --------------------------------------------------------------------------
# The Python / ML side (LeRobot, PyTorch, Rerun) runs in a container with the NVIDIA
# runtime and --ipc=host, which is how it reaches obot-rtd's shared memory.
DOCKER_OCI_RUNTIMES ?= '{"nvidia":{"args":[],"path":"nvidia-container-runtime"}}'
DOCKER_DEFAULT_RUNTIME ?= "nvidia"

LICENSE_FLAGS_ACCEPTED += "commercial_ffmpeg commercial_x264"
