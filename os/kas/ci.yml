# Settings for unattended builds: lower the parallelism so a 16 GB machine does not run
# out of memory in the large C++ recipes, and keep downloads and shared state outside the
# build directory so they survive a clean build.
header:
  version: 14
local_conf_header:
  ci: |
    BB_NUMBER_THREADS ?= "8"
    PARALLEL_MAKE ?= "-j 8"
    BB_PRESSURE_MAX_MEMORY ?= "20000"
    INHERIT += "rm_work"
    # Fetch only the revisions that are built, not whole histories: the kernel repository
    # alone is several GB and its full clone needs more memory than the build itself.
    BB_GIT_SHALLOW ?= "1"
    BB_GIT_SHALLOW_DEPTH ?= "1"
    # These take their version from git tags, which a shallow fetch does not carry.
    BB_GIT_SHALLOW:pn-libnvidia-container = "0"
