# kas configuration for the obot robot image.
#
#   kas build os/kas/obot.yml:os/kas/orin-nano.yml
#
# Yocto 6.0 "wrynose" (LTS) with OE4T meta-tegra: Jetson Linux R39.2.1 (JetPack 7.2.1),
# kernel 6.8 with PREEMPT_RT. Every layer is pinned to a commit; to move forward, update
# the commits together (tegra-demo-distro's wrynose branch records combinations that the
# OE4T maintainers build).
header:
  version: 14

distro: obot
target: obot-image

repos:
  # This repository: the layer, and the sources of obot-rt (built from this checkout).
  obot:
    layers:
      os/meta-obot:

  bitbake:
    url: https://github.com/openembedded/bitbake.git
    branch: "2.18"
    commit: 6e260eb6ab1631607ea414d9ff8ede1155faa5d9
    layers:
      .: disabled

  openembedded-core:
    url: https://github.com/openembedded/openembedded-core.git
    branch: wrynose
    commit: 33a6bd6cc8a9a976902081642414bd67adc74879
    layers:
      meta:

  meta-openembedded:
    url: https://github.com/openembedded/meta-openembedded.git
    branch: wrynose
    commit: c0fcd7cca3760ef24e087ac4a31b8f357cb204da
    layers:
      meta-oe:
      meta-python:
      meta-networking:
      meta-filesystems:

  meta-virtualization:
    url: https://git.yoctoproject.org/meta-virtualization
    branch: wrynose
    commit: f27e2594ab43f4e596eb8e287e7e446ef4064810

  meta-tegra:
    url: https://github.com/OE4T/meta-tegra.git
    branch: wrynose
    commit: 30ea3e5784ab08233376648ac9feb63f8223aeff

bblayers_conf_header:
  obot: |
    BBPATH = "${TOPDIR}"
    BBFILES ?= ""

local_conf_header:
  obot: |
    CONF_VERSION = "2"
    PATCHRESOLVE = "noop"
    USER_CLASSES ?= "buildstats"
    BB_DISKMON_DIRS ??= "\
        STOPTASKS,${TMPDIR},1G,100K \
        STOPTASKS,${DL_DIR},1G,100K \
        STOPTASKS,${SSTATE_DIR},1G,100K \
        HALT,${TMPDIR},100M,1K \
        HALT,${DL_DIR},100M,1K \
        HALT,${SSTATE_DIR},100M,1K"
    # Development image: root login on the serial console and over ssh without a password.
    # Remove for anything that leaves the bench.
    EXTRA_IMAGE_FEATURES ?= "allow-empty-password empty-root-password allow-root-login"
